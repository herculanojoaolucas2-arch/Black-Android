name: NFSU2 Android

# Coloque este arquivo em .github/workflows/build-apk.yml
# Repositório PRIVADO. O default.xbe NÃO vai no git: suba-o como asset
# de uma Release com a tag "assets" (nome do arquivo: default.xbe).

on:
  workflow_dispatch:
    inputs:
      build:
        description: "Compilar o APK (false = só ler as versões do XDK)"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  inspect:
    name: Fase 1 - versões do XDK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Baixar default.xbe da Release "assets"
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p assets
          gh release download assets --pattern default.xbe --dir assets --repo "$GITHUB_REPOSITORY"
          ls -l assets

      - name: Ler tabela de bibliotecas do XBE
        run: |
          python3 - <<'EOF'
          import struct
          d = open('assets/default.xbe', 'rb').read()
          assert d[:4] == b'XBEH', 'Não é um XBE válido'
          base = struct.unpack_from('<I', d, 0x104)[0]
          n, addr = struct.unpack_from('<II', d, 0x160)
          print(f'Bibliotecas encontradas: {n}')
          print('-' * 30)
          for i in range(n):
              o = addr - base + i * 16
              name = d[o:o+8].rstrip(b'\0').decode('ascii', 'replace')
              maj, mi, bld, fl = struct.unpack_from('<4H', d, o + 8)
              print(f'{name:<10} {maj}.{mi:02d}.{bld}')
          print('-' * 30)
          print('Compare o build com as pastas xdk/<build> do XboxXBE-Recomp (hoje: 5849).')
          EOF

  build:
    name: Build do APK (Windows)
    needs: inspect
    if: ${{ inputs.build }}
    runs-on: windows-2022
    timeout-minutes: 360
    env:
      NDK_VERSION: 28.2.13676358
      CMAKE_VERSION: 3.31.6
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar SDK Platform 34, NDK e CMake
        shell: bash
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager.bat"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platforms;android-34" "ndk;$NDK_VERSION" "cmake;$CMAKE_VERSION"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/$NDK_VERSION" >> "$GITHUB_ENV"

      - name: Conferir ferramentas (Clang, Ninja)
        shell: cmd
        run: |
          where clang++ || choco install llvm -y
          where ninja || choco install ninja -y

      - name: Baixar default.xbe da Release "assets"
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p assets
          if [ ! -f assets/default.xbe ]; then
            gh release download assets --pattern default.xbe --dir assets --repo "$GITHUB_REPOSITORY"
          fi
          ls -l assets

      - name: Cache do Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle', 'gradle/wrapper/gradle-wrapper.properties') }}

      - name: Build (recompila o XBE e gera o APK)
        shell: cmd
        run: build.bat

      - name: Enviar APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nfsu2-apk
          path: app/build/outputs/apk/**/*.apk
          if-no-files-found: warn

      - name: Enviar logs e config gerada (para depuração)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logs
          path: |
            config/*.toml
            **/*.log
            app/build/reports/**
          if-no-files-found: ignore
